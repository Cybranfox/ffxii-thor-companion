name: ci
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Android SDK pieces
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" > /dev/null
      - name: Python test deps
        run: pip install lupa numpy Pillow cryptography
      - name: App tests (pure JVM; real-game tests skip without private data)
        run: JDK="$JAVA_HOME" bash app/tests/run_tests.sh
      - name: Game script tests
        run: bash game-script/tests/run_tests.sh
      - name: Data builder imports
        run: |
          python -B -c "import sys; sys.path.insert(0, 'builder'); import build_data_pack, vanilla_fallback, reference_pack, mapatlas_pack"
          python -B builder/tests/test_menumap_names.py
          python -B builder/tests/test_menumap_icons.py
      - name: Build APK (debug-signed here; releases are signed locally with the release key)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -validity 1 -dname "CN=CI" > /dev/null
          bash app/build.sh
      - name: No network permission and no game text in the APK
        run: |
          perms=$("$ANDROID_HOME/build-tools/35.0.1/aapt2" dump permissions app/build/ffxii-companion.apk)
          echo "$perms"
          if echo "$perms" | grep -q INTERNET; then echo "INTERNET permission found"; exit 1; fi
          if unzip -p app/build/ffxii-companion.apk classes.dex | grep -aq "Great Eastern Passage"; then echo "game text in dex"; exit 1; fi
          python -c "import zipfile,sys; n=zipfile.ZipFile('app/build/ffxii-companion.apk').namelist(); a=set(x for x in n if x.startswith('assets/install/')); print(sorted(a)); need={'assets/install/'+f for f in ('ThorCompanion-core.lua','install.cmd','uninstall.cmd','README.txt')}; sys.exit(0 if need<=a and not any(chr(92) in x for x in n) else 1)"
